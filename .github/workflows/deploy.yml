name: Deploy to Yandex Cloud Kubernetes

on:
  push:
    branches: [ main ]

env:
  REGISTRY_ID: crpkar551oikpfbasphi
  CLUSTER_ID: catk4rr52oqmbkfq8gpi
  FOLDER_ID: b1ggl5ltiejket301u08
  IMAGE_NAME: app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install YC CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure YC CLI  
        run: |
          echo '${{ secrets.YC_SA_KEY }}' > /tmp/key.json
          yc config profile create sa-profile
          yc config set service-account-key /tmp/key.json
          yc config set folder-id ${{ env.FOLDER_ID }}

      - name: Configure Docker
        run: yc container registry configure-docker ${{ env.REGISTRY_ID }}

      - name: Build and push image
        run: |
          docker build -t cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ./app
          docker push cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Configure kubectl
        run: yc managed-kubernetes cluster get-credentials --id ${{ env.CLUSTER_ID }} --external

      - name: Update deployment
        run: |
          kubectl set image deployment/web-app app-container=cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}